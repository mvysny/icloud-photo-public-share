before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - rm -f  .gradle/caches/modules-2/modules-2.lock
  - rm -fr .gradle/caches/*/plugin-resolution/
cache:
  key: "$CI_COMMIT_REF_NAME"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/
    - .gradle/build-cache/

# Test on the Java LTS versions; Gradle 8.14 runs on JDK 24 at most, so 25 waits for Gradle 9.1+
build:
  image: eclipse-temurin:${JDK}-jdk
  parallel:
    matrix:
      - JDK: ["8", "11", "17", "21"]
  script:
    - ./gradlew --no-daemon --no-watch-fs

# the doc layer's checks; needs only bash and git
design-tripwires:
  image: buildpack-deps:scm
  cache: []
  before_script: []
  script:
    - design/verify_design_tripwires.sh
