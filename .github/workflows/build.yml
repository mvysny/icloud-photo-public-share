name: Build

on: [push, pull_request]

jobs:
  # Test on the Java LTS versions. JDK 25 needs Gradle 9.1+, which itself runs on JDK 17+ only: 25 comes when 8 and 11 go,
  # not via toolchains.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-watch-fs

  # the doc layer's checks; needs only bash and git
  design-tripwires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: design/verify_design_tripwires.sh
